services:
  backend:
    build: ./backend
    ports: ["4000:4000"]
    env_file: ./backend/.env
    environment:
      - PORT=4000
      - FAKE_STORE_BASE_URL=https://fakestoreapi.com
      - SALES_EMAIL=sales@example.com
  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    env_file: ./frontend/.env
    environment:
      - VITE_API_URL=http://localhost:4000/api
    depends_on: [backend]
